{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modifier Commentaire</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f7d6df;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .comment-container{
            width:500px;
            background:#f3f3f3;
            padding:35px;
            border-radius:25px;
            box-shadow:0 5px 15px rgba(0,0,0,0.08);
            border-top:5px solid #ff4f8b;
        }

        h1{
            text-align:center;
            color:#7b0f1f;
            margin-bottom:30px;
            font-size:32px;
        }

        .form-group{
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#7b0f1f;
            font-size:16px;
        }

        textarea{
            width:100%;
            min-height:140px;
            padding:12px;
            border:1px solid #ccc;
            border-radius:12px;
            font-size:16px;
            outline:none;
            resize:none;
        }

        textarea:focus{
            border:2px solid #ff4f8b;
        }

        .buttons{
            display:flex;
            justify-content:center;
            gap:15px;
            margin-top:25px;
        }

        .btn{
            padding:12px 22px;
            border:none;
            border-radius:12px;
            text-decoration:none;
            color:white;
            font-weight:bold;
            cursor:pointer;
            font-size:15px;
        }

        .btn-save{
            background:#f4c56c;
        }

        .btn-return{
            background:#a8a8a8;
        }

        .btn:hover{
            opacity:0.9;
        }

    </style>

</head>

<body>

    <div class="comment-container">

        <h1>Modifier Commentaire</h1>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>Commentaire</label>

                {{ form.contenu_com }}

            </div>

            <div class="buttons">

                <button type="submit" class="btn btn-save">
                    Modifier
                </button>

                <a href="javascript:history.back()" class="btn btn-return">
                    Retour
                </a>

            </div>

        </form>

    </div>

</body>
</html>
