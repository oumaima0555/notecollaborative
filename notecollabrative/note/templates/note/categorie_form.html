{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{{ titre_page }}</title>
    <link rel="stylesheet" href="{% static 'note/css/style.css' %}">
</head>
<body>

<h2>{{ titre_page }}</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-success">
        Enregistrer
    </button>
</form>

<a href="{% url 'note_liste' %}" class="btn btn-secondary" style="display:block; width:450px; margin:10px auto;">
    Retour
</a>

</body>
</html>
