{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ajouter média</title>
    <link rel="stylesheet" href="{% static 'note/css/style.css' %}">
</head>
<body>

<h1>Ajouter un média à : {{ note.titre }}</h1>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Ajouter</button>
</form>

<br>

<a href="{% url 'note_detail' note.id %}">Retour</a>

</body>
</html>
