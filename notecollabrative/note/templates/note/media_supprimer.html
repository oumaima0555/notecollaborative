{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Supprimer média</title>
    <link rel="stylesheet" href="{% static 'note/css/style.css' %}">
</head>
<body>

<div class="container">
    <div class="note-item">
        <h1>Supprimer le média</h1>

        <p>Voulez-vous vraiment supprimer ce média ?</p>

        {% if media.url %}
            <p>
                <strong>Lien :</strong>
                <a href="{{ media.url }}" target="_blank">{{ media.url }}</a>
            </p>
        {% endif %}

        {% if media.image %}
            <p>
                <strong>Image :</strong><br>
                <img src="{{ media.image.url }}" style="max-width: 250px; border-radius: 10px;">
            </p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Oui, supprimer</button>
            <a href="{% url 'note_detail' note.id %}" class="btn btn-secondary">Annuler</a>
        </form>
    </div>
</div>

</body>
</html>
