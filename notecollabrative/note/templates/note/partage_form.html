{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Partager la note</title>
    <link rel="stylesheet" href="{% static 'note/css/style.css' %}">
</head>
<body>

<div class="container">

    <h1>Partager la note : {{ note.titre }}</h1>

    <form method="POST">
        {% csrf_token %}

        <div>
            <label>Collaborateur :</label>
            {{ form.collaborateur }}
        </div>

        <br>

        <div>
            <label>Permission :</label>
            {{ form.permission }}
        </div>

        <br>

        <div class="actions">
            <button type="submit" class="btn btn-primary">
                Partager
            </button>

            <a href="{% url 'note_detail' note.id %}" class="btn btn-secondary">
                Retour
            </a>
        </div>
    </form>

</div>

</body>
</html>
