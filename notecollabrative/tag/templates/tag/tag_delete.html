<!-- tag_delete.html -->

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Supprimer Tag</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#efb7cf;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:600px;
            background:white;
            border-radius:30px;
            padding:40px;
            text-align:center;
            box-shadow:0 10px 25px rgba(0,0,0,0.1);
        }

        h1{
            color:#e84393;
            margin-bottom:25px;
            font-size:40px;
        }

        p{
            font-size:22px;
            margin-bottom:30px;
            color:#444;
        }

        button{
            background:#ff4fa3;
            color:white;
            border:none;
            padding:15px 35px;
            border-radius:15px;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#e84393;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Supprimer Tag</h1>

        <p>
            Voulez-vous supprimer <strong>{{ tag.nom_tag }}</strong> ?
        </p>

        <form method="POST">

            {% csrf_token %}

            <button type="submit">
                Oui supprimer
            </button>

        </form>

    </div>

</body>
</html>
