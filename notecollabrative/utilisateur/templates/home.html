<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

    <style>

        body{
            margin:0;
            font-family:Poppins,sans-serif;
            background:#ffd9e2;
        }

        .navbar{
            background:#ff8fb1;
            padding:15px 30px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            color:white;
        }

        .navbar h2{
            margin:0;
        }

        .logout-btn{
            background:white;
            color:#ff4f87;
            padding:10px 18px;
            border-radius:10px;
            text-decoration:none;
            font-weight:bold;
        }
        
        .profile-btn{
            background:white;
            color:#ff4f87;
            padding:10px 18px;
            border-radius:10px;
            text-decoration:none;
            font-weight:bold;
            margin-left: 70%;
        }

        .container{
            padding:40px;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:20px;
            margin-top:30px;
        }

        .card{
            background:white;
            padding:25px;
            border-radius:18px;
            box-shadow:0 5px 15px rgba(0,0,0,0.08);
        }

        .card h3{
            color:#ff4f87;
        }

    </style>

</head>

<body>

    <div class="navbar">

        <h2>
            Notes App
        </h2>
        <a href="{% url 'profile' %}" class="profile-btn">
             Profil
        </a>
        <a href="{% url 'logout' %}" class="logout-btn">
            Déconnexion
        </a>

    </div>

    <div class="container">

        <h1>
            Bienvenue {{ request.user.username }}
        </h1>

        <p>
            Tableau de bord utilisateur
        </p>

        <div class="cards">

            <div class="card">
                <h3>Mes notes</h3>
                <p>Créer et gérer vos notes.</p>
            </div>

            <div class="card">
                <h3>Collaborations</h3>
                <p>Partager avec d’autres utilisateurs.</p>
            </div>

            <div class="card">
                <h3>Notifications</h3>
                <p>Voir les modifications récentes.</p>
            </div>

        </div>

    </div>

</body>
</html>
