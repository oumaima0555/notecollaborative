<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion - Notes App</title>

    <!-- ICONS -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- GOOGLE FONT -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:"Poppins",sans-serif;

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:linear-gradient(135deg,#ffd6e7,#ffc2dc,#ff9fc8);

            overflow:hidden;

        }

        /* CONTAINER */

        .container{

            width:950px;

            height:560px;

            background:white;

            border-radius:30px;

            overflow:hidden;

            display:flex;

            box-shadow:0 15px 40px rgba(0,0,0,0.15);

            position:relative;

        }

        /* LEFT SIDE */

        .left{

            width:50%;

            background:linear-gradient(135deg,#ff4fa3,#ff85c2);

            color:white;

            padding:60px 45px;

            display:flex;

            flex-direction:column;

            justify-content:center;

            position:relative;

        }

        .left::before{

            content:"";

            position:absolute;

            width:240px;

            height:240px;

            border-radius:50%;

            background:rgba(255,255,255,0.1);

            top:-70px;

            left:-70px;

        }

        .logo{

            width:90px;

            height:90px;

            border-radius:50%;

            background:rgba(255,255,255,0.15);

            display:flex;

            justify-content:center;

            align-items:center;

            margin-bottom:30px;

            z-index:2;

        }

        .logo i{

            font-size:38px;

            color:white;

        }

        .left h1{

            font-size:50px;

            line-height:1.1;

            margin-bottom:20px;

            z-index:2;

        }

        .left p{

            font-size:17px;

            line-height:1.8;

            z-index:2;

        }

        /* RIGHT SIDE */

        .right{

            width:50%;

            padding:55px 45px;

            display:flex;

            flex-direction:column;

            justify-content:center;

            position:relative;

        }

        .dark-btn{

            position:absolute;

            top:20px;

            right:20px;

            width:45px;

            height:45px;

            border:none;

            border-radius:50%;

            background:#fff0f7;

            color:#ff4fa3;

            cursor:pointer;

            font-size:18px;

            transition:0.3s;

        }

        .dark-btn:hover{

            background:#ff4fa3;

            color:white;

        }

        .title{

            text-align:center;

            color:#d63384;

            font-size:42px;

            font-weight:800;

            margin-bottom:8px;

        }

        .subtitle{

            text-align:center;

            color:#777;

            margin-bottom:35px;

        }

        /* INPUT */

        .input-box{

            position:relative;

            margin-bottom:22px;

        }

        .input-box i{

            position:absolute;

            top:50%;

            left:16px;

            transform:translateY(-50%);

            color:#ff4fa3;

            font-size:16px;

        }

        .input-box input{

            width:100%;

            padding:15px 15px 15px 48px;

            border:2px solid #ffd1e6;

            border-radius:14px;

            outline:none;

            font-size:15px;

            transition:0.3s;

        }

        .input-box input:focus{

            border-color:#ff4fa3;

            box-shadow:0 0 0 4px rgba(255,79,163,0.15);

        }

        /* BUTTON */

        .login-btn{

            width:100%;

            padding:15px;

            border:none;

            border-radius:14px;

            background:linear-gradient(135deg,#ff4fa3,#ff85c2);

            color:white;

            font-size:16px;

            font-weight:700;

            cursor:pointer;

            transition:0.3s;

            margin-top:10px;

            box-shadow:0 8px 18px rgba(255,79,163,0.3);

        }

        .login-btn:hover{

            transform:translateY(-2px);

            box-shadow:0 12px 24px rgba(255,79,163,0.35);

        }

        .login-btn i{

            margin-right:8px;

        }

        /* SOCIAL */

        .social-icons{

            margin-top:25px;

            display:flex;

            justify-content:center;

            gap:15px;

        }

        .social-icons a{

            width:45px;

            height:45px;

            background:#fff0f7;

            border-radius:50%;

            display:flex;

            justify-content:center;

            align-items:center;

            color:#ff4fa3;

            text-decoration:none;

            font-size:18px;

            transition:0.3s;

        }

        .social-icons a:hover{

            background:#ff4fa3;

            color:white;

        }

        /* FOOTER */

        .footer{

            text-align:center;

            margin-top:25px;

            color:#666;

        }

        .footer a{

            color:#ff4fa3;

            font-weight:700;

            text-decoration:none;

        }

        .footer a:hover{

            text-decoration:underline;

        }

        /* DARK MODE */

        body.dark{

            background:#111827;

        }

        body.dark .container{

            background:#1f2937;

        }

        body.dark .right{

            background:#1f2937;

        }

        body.dark .title{

            color:white;

        }

        body.dark .subtitle,

        body.dark .footer{

            color:#ccc;

        }

        body.dark input{

            background:#111827;

            border:2px solid #374151;

            color:white;

        }

        body.dark .dark-btn{

            background:#374151;

            color:white;

        }

        /* RESPONSIVE */

        @media(max-width:950px){

            .container{

                width:95%;

                height:auto;

                flex-direction:column;

            }

            .left{

                width:100%;

                text-align:center;

                align-items:center;

            }

            .right{

                width:100%;

            }

        }

    </style>

</head>

<body>

    <div class="container">

        <!-- LEFT -->

        <div class="left">

            <div class="logo">

                <i class="fa-solid fa-note-sticky"></i>

            </div>

            <h1>

                Notes App

            </h1>

            <p>

                Créez, partagez et gérez vos notes collaboratives
                facilement avec une interface moderne et professionnelle.

            </p>

        </div>

        <!-- RIGHT -->

        <div class="right">

            <!-- DARK MODE -->

            <button class="dark-btn" onclick="toggleDarkMode()">

                <i class="fa-solid fa-moon"></i>

            </button>

            <h2 class="title">

                Connexion

            </h2>

            <p class="subtitle">

                Connectez-vous à votre compte

            </p>

            <!-- FORM -->

            <form method="POST">

                {% csrf_token %}

                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        name="username"
                        placeholder="Nom d'utilisateur"
                        required
                    >

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        name="password"
                        placeholder="Mot de passe"
                        required
                    >

                </div>

                <button type="submit" class="login-btn">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Se connecter

                </button>

            </form>

            <!-- SOCIAL -->

            <div class="social-icons">

                <a href="#">
                    <i class="fa-brands fa-google"></i>
                </a>

                <a href="#">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>

                <a href="#">
                    <i class="fa-brands fa-github"></i>
                </a>

            </div>

            <!-- FOOTER -->

            <div class="footer">

                Pas de compte ?

                <a href="{% url 'register' %}">

                    S'inscrire

                </a>

            </div>

        </div>

    </div>

    <script>

        function toggleDarkMode(){

            document.body.classList.toggle("dark");

        }

    </script>

</body>

</html>
