<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Profil</title>

    <style>

        body{
            margin:0;
            font-family:Poppins,sans-serif;
            background:#ffd9e2;
        }

        .navbar{
            background:#ff8fb1;
            padding:15px 30px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            color:white;
        }

        .navbar h2{
            margin:0;
        }

        .nav-links{
            display:flex;
            gap:15px;
        }

        .nav-links a{
            background:white;
            color:#ff4f87;
            padding:10px 18px;
            border-radius:10px;
            text-decoration:none;
            font-weight:bold;
        }

        .container{
            width:500px;
            margin:50px auto;
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 5px 15px rgba(0,0,0,0.1);
        }

        h1{
            color:#ff4f87;
            margin-bottom:25px;
        }

        label{
            display:block;
            margin-top:15px;
            margin-bottom:6px;
            font-weight:bold;
            color:#ff4f87;
        }

        input{
            width:100%;
            padding:14px;
            border:2px solid #ffc0cb;
            border-radius:12px;
            outline:none;
            box-sizing:border-box;
        }

        button{
            width:100%;
            margin-top:25px;
            padding:15px;
            border:none;
            border-radius:12px;
            background:#ff4f87;
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
        }

        button:hover{
            background:#ff2f72;
        }

        .message{
            text-align:center;
            color:green;
            margin-top:15px;
        }

    </style>

</head>

<body>

    <div class="navbar">

        <h2>
            Notes App
        </h2>

        <div class="nav-links">

            <a href="{% url 'home' %}">
                Dashboard
            </a>

            <a href="{% url 'logout' %}">
                Déconnexion
            </a>

        </div>

    </div>

    <div class="container">

        <h1>
            Mon Profil
        </h1>
        <form method="POST">

            {% csrf_token %}

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                value="{{ request.user.username }}"
                required
            >

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                value="{{ request.user.email }}"
                required
            >

            <label>
                Nouveau mot de passe
            </label>

            <input
                type="password"
                name="password"
                placeholder="Laisser vide pour ne pas changer"
            >

            <button type="submit">
                Modifier le profil
            </button>

        </form>

    </div>

</body>

</html>
