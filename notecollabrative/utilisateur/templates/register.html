{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inscription - Notes App</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:"Poppins",sans-serif;

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:linear-gradient(135deg,#ffd6e7,#ffc2dc,#ff9fc8);

            padding:20px;

        }

        .container{

            width:1100px;

            min-height:650px;

            background:white;

            border-radius:30px;

            overflow:hidden;

            display:flex;

            box-shadow:0 15px 40px rgba(0,0,0,0.15);

        }

        .left{

            width:50%;

            background:linear-gradient(135deg,#ff4fa3,#ff85c2);

            color:white;

            padding:60px 45px;

            display:flex;

            flex-direction:column;

            justify-content:center;

            position:relative;

        }

        .left::before{

            content:"";

            position:absolute;

            width:250px;

            height:250px;

            border-radius:50%;

            background:rgba(255,255,255,0.1);

            top:-80px;

            left:-80px;

        }

        .logo{

            width:90px;

            height:90px;

            border-radius:50%;

            background:rgba(255,255,255,0.15);

            display:flex;

            justify-content:center;

            align-items:center;

            margin-bottom:30px;

            z-index:2;

        }

        .logo i{

            font-size:38px;

            color:white;

        }

        .left h1{

            font-size:56px;

            line-height:1.2;

            margin-bottom:20px;

            z-index:2;

        }

        .left p{

            font-size:18px;

            line-height:1.9;

            z-index:2;

        }

        .right{

            width:50%;

            padding:60px 50px;

            display:flex;

            flex-direction:column;

            justify-content:center;

        }

        .title{

            text-align:center;

            color:#d63384;

            font-size:52px;

            font-weight:800;

            margin-bottom:10px;

            line-height:1.2;

        }

        .subtitle{

            text-align:center;

            color:#777;

            margin-bottom:35px;

            font-size:17px;

        }

        .input-box{

            position:relative;

            margin-bottom:20px;

        }

        .input-box i{

            position:absolute;

            top:50%;

            left:18px;

            transform:translateY(-50%);

            color:#ff4fa3;

            font-size:17px;

            z-index:2;

        }

        .input-box input{

            width:100%;

            padding:16px 16px 16px 55px;

            border:2px solid #ffd1e6;

            border-radius:14px;

            outline:none;

            font-size:15px;

            transition:0.3s;

            background:white;

        }

        .input-box input:focus{

            border-color:#ff4fa3;

            box-shadow:0 0 0 4px rgba(255,79,163,0.15);

        }

        .register-btn{

            width:100%;

            padding:16px;

            border:none;

            border-radius:14px;

            background:linear-gradient(135deg,#ff4fa3,#ff85c2);

            color:white;

            font-size:17px;

            font-weight:700;

            cursor:pointer;

            transition:0.3s;

            margin-top:10px;

            box-shadow:0 8px 18px rgba(255,79,163,0.3);

        }

        .register-btn:hover{

            transform:translateY(-2px);

            box-shadow:0 12px 24px rgba(255,79,163,0.35);

        }

        .login-link{

            margin-top:18px;

            text-align:center;

        }

        .login-link a{

            display:inline-block;

            padding:12px 25px;

            border:2px solid #ff4fa3;

            border-radius:12px;

            color:#ff4fa3;

            text-decoration:none;

            font-weight:600;

            transition:0.3s;

        }

        .login-link a:hover{

            background:#ff4fa3;

            color:white;

        }

        .error{

            background:#ffe5e5;

            color:#d8000c;

            padding:12px;

            border-radius:10px;

            margin-bottom:20px;

            text-align:center;

        }

        @media(max-width:950px){

            .container{

                width:95%;

                flex-direction:column;

            }

            .left{

                width:100%;

                text-align:center;

                align-items:center;

            }

            .right{

                width:100%;

            }

        }

    </style>

</head>

<body>

    <div class="container">

        <!-- LEFT -->

        <div class="left">

            <div class="logo">

                <i class="fa-solid fa-note-sticky"></i>

            </div>

            <h1>

                Notes App

            </h1>

            <p>

                Créez votre espace collaboratif,
                partagez vos idées et gérez vos notes
                facilement.

            </p>

        </div>

        <!-- RIGHT -->

        <div class="right">

            <h2 class="title">

                Inscription

            </h2>

            <p class="subtitle">

                Créez votre compte gratuitement

            </p>

            {% if error %}

                <div class="error">

                    {{ error }}

                </div>

            {% endif %}

            <form method="POST" action="{% url 'register' %}">

                {% csrf_token %}

                <div class="input-box">

                    <i class="fa-solid fa-id-card"></i>

                    <input type="text"
                           name="nom"
                           placeholder="Nom"
                           required>

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input type="text"
                           name="prenom"
                           placeholder="Prénom"
                           required>

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-phone"></i>

                    <input type="text"
                           name="num"
                           placeholder="Téléphone"
                           required>

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-at"></i>

                    <input type="text"
                           name="username"
                           placeholder="Nom utilisateur"
                           required>

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input type="email"
                           name="email"
                           placeholder="Email"
                           required>

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input type="password"
                           name="password"
                           placeholder="Mot de passe"
                           required>

                </div>

                <button type="submit" class="register-btn">

                    <i class="fa-solid fa-user-plus"></i>

                    S'inscrire

                </button>

            </form>

            <div class="login-link">

                <a href="{% url 'login' %}">

                    Retour à la connexion

                </a>

            </div>

        </div>

    </div>

</body>

</html>
