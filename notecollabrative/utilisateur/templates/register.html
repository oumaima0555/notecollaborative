<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inscription</title>

    <style>

        body{
            background:#ffd9e2;
            font-family:"Poppins","Segoe UI",Arial,sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            margin:0;
        }

        .register-card{
            width:420px;
            background:#ffe5ec;
            border-radius:20px;
            border:2px solid #ffc6d3;
            padding:30px;
            box-shadow:0 8px 20px rgba(0,0,0,0.08);
        }

        h1{
            text-align:center;
            color:#7a1b22;
            font-size:32px;
            font-weight:800;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:#7a1b22;
            margin-bottom:25px;
            font-size:14px;
        }

        label{
            display:block;
            margin-top:12px;
            margin-bottom:5px;
            color:#7a1b22;
            font-weight:600;
            font-size:14px;
        }

        input{
            width:100%;
            padding:10px 12px;
            border:2px solid #ffc6d3;
            border-radius:12px;
            background:white;
            outline:none;
            font-size:14px;
            box-sizing:border-box;
        }

        input:focus{
            border-color:#f29bb2;
        }

        button{
            width:100%;
            margin-top:20px;
            padding:12px;
            border:none;
            border-radius:14px;
            background:#e88f6a;
            color:white;
            font-weight:700;
            font-size:15px;
            cursor:pointer;
            transition:.2s;
        }

        button:hover{
            opacity:.9;
            transform:translateY(-1px);
        }

        .login-link{
            text-align:center;
            margin-top:18px;
        }

        .login-link a{
            color:#7a1b22;
            text-decoration:none;
            font-weight:700;
        }

        .helptext{
            display:none;
        }

        ul{
            display:none;
        }

    </style>

</head>

<body>

    <div class="register-card">

        <h1>Créer un compte</h1>

        <p class="subtitle">
            Rejoignez votre espace collaboratif
        </p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                S'inscrire
            </button>

        </form>

        <div class="login-link">

            <a href="{% url 'login' %}">
                Retour connexion
            </a>

        </div>

    </div>

</body>

</html>
